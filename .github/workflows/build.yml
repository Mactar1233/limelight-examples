name: Build WPILib Projects

on:
  push:
    branches: [ main, develop, mactar ]
  pull_request:
    branches: [ main, mactar ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project: [java-wpilib/swerve-aim-and-range, java-wpilib/swerve-megatag-odometry, java-wpilib/tank-aim-and-range, java-wpilib/tank-aim-and-range-commandbased]
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages and vendor libraries
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ${{ matrix.project }}/vendordeps/
        key: ${{ runner.os }}-gradle-${{ matrix.project }}-${{ hashFiles(format('{0}/**/*.gradle*', matrix.project), format('{0}/**/gradle-wrapper.properties', matrix.project), format('{0}/vendordeps/*.json', matrix.project)) }}
        restore-keys: |
          ${{ runner.os }}-gradle-${{ matrix.project }}-
          ${{ runner.os }}-gradle-
          
    - name: Check project structure
      run: |
        echo "Building project: ${{ matrix.project }}"
        echo "Project directory contents:"
        ls -la ${{ matrix.project }}/
        
    - name: Make gradlew executable
      run: |
        if [ -f "${{ matrix.project }}/gradlew" ]; then
          chmod +x ${{ matrix.project }}/gradlew
        else
          echo "gradlew not found in ${{ matrix.project }}/"
        fi
      
    - name: Build with Gradle
      working-directory: ${{ matrix.project }}
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew build --console=plain
        else
          gradle build --console=plain
        fi
      
    - name: Run tests
      working-directory: ${{ matrix.project }}
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew test --console=plain
        else
          gradle test --console=plain
        fi
      continue-on-error: true
      
    - name: Set artifact name
      id: artifact-name
      run: echo "name=$(echo '${{ matrix.project }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ${{ steps.artifact-name.outputs.name }}-build-artifacts
        path: |
          ${{ matrix.project }}/build/libs/
          ${{ matrix.project }}/build/distributions/
        retention-days: 30