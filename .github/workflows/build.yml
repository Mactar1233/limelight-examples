name: Build WPILib Project

on:
  push:
    branches: [ mactar ]
  pull_request:
    branches: [ mactar ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages and vendor libraries
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          vendordeps/
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'vendordeps/*.json') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Download vendor libraries
      run: ./gradlew vendordep --console=plain
      
    - name: Build with Gradle
      run: ./gradlew build --console=plain
      
    - name: Run tests
      run: ./gradlew test --console=plain
      

      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts
        path: |
          build/libs/
          build/distributions/
        retention-days: 30